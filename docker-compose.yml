name: bike-weather-lab

x-airflow: &airflow
  image: bike-weather-airflow:2.10.5
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@metadata/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__PARALLELISM: '4'
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '4'
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/New_York
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: America/New_York
    AIRFLOW__WEBSERVER__SECRET_KEY: local-classroom-session-key
    AIRFLOW__WEBSERVER__WORKERS: '2'
    AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: '300'
    AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: '300'
    GUNICORN_CMD_ARGS: '--worker-tmp-dir /dev/shm'
    DATA_DATABASE_URL: postgresql+psycopg2://bike:bike@warehouse/bikes
    PYTHONPATH: /opt/project
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - .:/opt/project
    - airflow_logs:/opt/airflow/logs
  depends_on:
    metadata:
      condition: service_healthy
    warehouse:
      condition: service_healthy

services:
  metadata:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - metadata_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U airflow -d airflow']
      interval: 5s
      timeout: 5s
      retries: 20

  warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: bike
      POSTGRES_PASSWORD: bike
      POSTGRES_DB: bikes
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U bike -d bikes']
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-init:
    <<: *airflow
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    command: version

  airflow-webserver:
    <<: *airflow
    command: webserver
    ports: ['127.0.0.1:8088:8080']

  airflow-scheduler:
    <<: *airflow
    command: scheduler

  agents:
    build: .
    environment:
      DATA_DATABASE_URL: postgresql+psycopg2://bike:bike@warehouse/bikes
    ports: ['127.0.0.1:8501:8501']
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      warehouse:
        condition: service_healthy

volumes:
  metadata_data:
  warehouse_data:
  airflow_logs:

